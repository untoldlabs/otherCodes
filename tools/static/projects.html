<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>other.codes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0e0e0e; color: #ccc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

  header { padding: 24px 32px 16px; border-bottom: 1px solid #1e1e1e; display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 18px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
  header .sub { font-size: 12px; color: #444; }

  .main { flex: 1; padding: 28px 32px; max-width: 860px; }

  /* Projects folder bar */
  .folder-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 28px;
                background: #161616; border: 1px solid #2a2a2a; border-radius: 6px; padding: 10px 14px; }
  .folder-bar .label { font-size: 11px; color: #555; flex-shrink: 0; }
  .folder-bar .path  { font-size: 12px; color: #888; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: monospace; }
  .folder-bar input  { flex: 1; background: #1e1e1e; border: 1px solid #333; border-radius: 4px;
                        color: #ccc; font-size: 12px; padding: 5px 8px; font-family: monospace; display: none; }
  .folder-bar input:focus { outline: none; border-color: #4a6fa5; }
  .btn-link { background: none; border: none; color: #4a6fa5; font-size: 11px; cursor: pointer; padding: 2px 4px; border-radius: 3px; }
  .btn-link:hover { background: #1a2030; }

  /* Section heading */
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-head h2 { font-size: 13px; font-weight: 500; color: #888; }

  /* New project */
  .new-project-row { display: flex; gap: 8px; margin-bottom: 24px; }
  .new-project-row input { flex: 1; background: #161616; border: 1px solid #2a2a2a; border-radius: 6px;
                            color: #ccc; font-size: 13px; padding: 9px 12px; }
  .new-project-row input:focus { outline: none; border-color: #4a6fa5; }
  .new-project-row input::placeholder { color: #444; }

  /* Buttons */
  .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.1s; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-primary:disabled { background: #1a2030; color: #444; cursor: default; }
  .btn-open { background: #1e2a1e; color: #4a9; border: 1px solid #2a3a2a; padding: 7px 14px; font-size: 12px; }
  .btn-open:hover { background: #253525; }

  /* Project cards */
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .project-card { background: #141414; border: 1px solid #222; border-radius: 8px; padding: 16px;
                  display: flex; flex-direction: column; gap: 10px; transition: border-color 0.1s; }
  .project-card:hover { border-color: #2a3a5a; }
  .project-card.active { border-color: #2563eb; }
  .card-name { font-size: 14px; font-weight: 600; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-stats { font-size: 11px; color: #555; display: flex; gap: 12px; }
  .card-stats .done { color: #3a9; }
  .card-path { font-size: 10px; color: #333; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Empty state */
  .empty { color: #444; font-size: 13px; padding: 32px 0; }

  /* Status */
  #status { font-size: 12px; color: #e87; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<header>
  <h1>other.codes</h1>
  <span class="sub">graffiti tag analysis</span>
</header>

<div class="main">

  <!-- Projects folder -->
  <div class="folder-bar" id="folder-bar">
    <span class="label">Projects&nbsp;folder</span>
    <span class="path" id="folder-path">—</span>
    <input type="text" id="folder-input" placeholder="/path/to/projects">
    <button class="btn-link" id="btn-change" onclick="startChangeFolder()">Change</button>
    <button class="btn-link" id="btn-save-folder" style="display:none;color:#3a9" onclick="saveFolder()">Save</button>
    <button class="btn-link" id="btn-cancel-folder" style="display:none;color:#888" onclick="cancelFolder()">Cancel</button>
  </div>

  <!-- New project -->
  <div class="new-project-row">
    <input type="text" id="new-name" placeholder="New project name  (e.g. street_graffiti)" maxlength="64"
           oninput="document.getElementById('btn-create').disabled=!this.value.trim()"
           onkeydown="if(event.key==='Enter') createProject()">
    <button class="btn btn-primary" id="btn-create" onclick="createProject()" disabled>+ Create</button>
  </div>

  <div id="status"></div>

  <!-- Project list -->
  <div class="section-head">
    <h2>Projects</h2>
    <button class="btn-link" onclick="loadProjects()">↺ Refresh</button>
  </div>
  <div id="projects-grid" class="projects-grid">
    <div class="empty">Loading…</div>
  </div>

</div>

<script>
let currentFolder = '';

async function loadConfig() {
  const res = await fetch('/api/config');
  const cfg = await res.json();
  currentFolder = cfg.projects_dir;
  document.getElementById('folder-path').textContent = cfg.projects_dir;
}

async function loadProjects() {
  const res  = await fetch('/api/projects');
  const data = await res.json();
  const grid = document.getElementById('projects-grid');
  if (!data.projects.length) {
    grid.innerHTML = '<div class="empty">No projects yet — create one above.</div>';
    return;
  }
  grid.innerHTML = data.projects.map(p => `
    <div class="project-card ${p.active ? 'active' : ''}">
      <div class="card-name">${p.name}</div>
      <div class="card-stats">
        <span>${p.n_photos} photo${p.n_photos !== 1 ? 's' : ''}</span>
        <span class="done">${p.n_segmented} segmented</span>
      </div>
      <div class="card-path">${p.path}</div>
      <button class="btn btn-open" onclick="openProject('${p.path}')">Open →</button>
    </div>`).join('');
}

async function openProject(path) {
  setStatus('Opening…');
  const res  = await fetch('/api/projects/open', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({path}),
  });
  const data = await res.json();
  if (data.error) { setStatus(data.error); return; }
  window.location.href = '/';   // reloads → Flask now serves annotate.html
}

async function createProject() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) return;
  setStatus('Creating…');
  const res  = await fetch('/api/projects', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name}),
  });
  const data = await res.json();
  if (data.error) { setStatus(data.error); return; }
  setStatus('');
  document.getElementById('new-name').value = '';
  document.getElementById('btn-create').disabled = true;
  // Project is now open — go straight to annotator
  window.location.href = '/';
}

function startChangeFolder() {
  document.getElementById('folder-path').style.display   = 'none';
  document.getElementById('folder-input').style.display  = '';
  document.getElementById('folder-input').value          = currentFolder;
  document.getElementById('btn-change').style.display    = 'none';
  document.getElementById('btn-save-folder').style.display   = '';
  document.getElementById('btn-cancel-folder').style.display = '';
  document.getElementById('folder-input').focus();
}

function cancelFolder() {
  document.getElementById('folder-path').style.display       = '';
  document.getElementById('folder-input').style.display      = 'none';
  document.getElementById('btn-change').style.display        = '';
  document.getElementById('btn-save-folder').style.display   = 'none';
  document.getElementById('btn-cancel-folder').style.display = 'none';
}

async function saveFolder() {
  const newPath = document.getElementById('folder-input').value.trim();
  if (!newPath) return;
  await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({projects_dir: newPath}),
  });
  currentFolder = newPath;
  document.getElementById('folder-path').textContent = newPath;
  cancelFolder();
  loadProjects();
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// Init
loadConfig().then(loadProjects);
</script>
</body>
</html>
